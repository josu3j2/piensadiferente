<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Línea del tiempo: de los Andes prehispánicos a 1809</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f0e4;--card:#fffaf0;--text:#2a2016;--muted:#7a6f5c;--line:#c9b99a;
--c1:#8a6d3b;--c2:#6b3a2e;--c3:#3d6b5a;--c4:#4a5a8a;--c5:#a8452f;--c6:#9a6a1f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1610;--card:#2a2016;--text:#f1e8d6;--muted:#a89a80;--line:#4a3d2c}}
:root[data-theme="dark"]{--bg:#1d1610;--card:#2a2016;--text:#f1e8d6;--muted:#a89a80;--line:#4a3d2c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Georgia,'Times New Roman',serif;line-height:1.5}
header{padding:28px 20px 8px;max-width:760px;margin:0 auto}
h1{font-size:clamp(1.6rem,5vw,2.3rem);margin:0 0 6px}
header p{margin:0;color:var(--muted);font-family:system-ui,sans-serif;font-size:.95rem}
.filters{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 20px;max-width:760px;margin:0 auto;display:flex;gap:8px;flex-wrap:wrap;font-family:system-ui,sans-serif}
.filters button{border:1.5px solid var(--line);background:transparent;color:var(--text);padding:6px 12px;border-radius:999px;font-size:.85rem;cursor:pointer}
.filters button.on{background:var(--text);color:var(--bg);border-color:var(--text)}
main{max-width:760px;margin:0 auto;padding:10px 20px 60px;position:relative}
main::before{content:"";position:absolute;left:34px;top:0;bottom:40px;width:2px;background:var(--line)}
.ev{position:relative;margin:0 0 14px 40px}
.ev::before{content:"";position:absolute;left:-14px;top:18px;width:14px;height:14px;border-radius:50%;background:var(--col);border:3px solid var(--bg);transform:translateX(-50%)}
.ev button{all:unset;display:block;width:100%;cursor:pointer;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--col);border-radius:8px;padding:12px 14px}
.ev button:focus-visible{outline:2px solid var(--col)}
.yr{font-family:system-ui,sans-serif;font-weight:700;font-size:.8rem;color:var(--col);letter-spacing:.04em}
.tt{font-size:1.08rem;font-weight:700;margin:2px 0}
.dd{max-height:0;overflow:hidden;transition:max-height .3s ease;color:var(--muted);font-size:.95rem}
.ev.open .dd{max-height:220px;margin-top:6px}
.hint{font-family:system-ui,sans-serif;font-size:.75rem;color:var(--muted)}
.ev.open .hint{display:none}
.brand{display:flex;align-items:center;gap:12px;margin:0 0 14px;font-family:system-ui,sans-serif}
.brand img{height:56px;width:auto;background:#fff;border-radius:10px;padding:4px 8px;border:1px solid var(--line)}
.brand span{font-size:.85rem;color:var(--muted);line-height:1.3}
.brand b{display:block;color:var(--text);font-size:.95rem}
footer{max-width:760px;margin:0 auto;padding:0 20px 40px;font-family:system-ui,sans-serif;font-size:.8rem;color:var(--muted)}
.tabs{max-width:760px;margin:0 auto;padding:6px 20px 0;display:flex;gap:8px;font-family:system-ui,sans-serif}
.tabs button{flex:1;border:1.5px solid var(--line);background:transparent;color:var(--text);padding:10px;border-radius:10px;font-size:.95rem;font-weight:600;cursor:pointer}
.tabs button.on{background:var(--text);color:var(--bg);border-color:var(--text)}
#exam{max-width:760px;margin:0 auto;padding:16px 20px 60px;font-family:system-ui,sans-serif}
.ex-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.ex-prog{font-size:.8rem;color:var(--muted);margin-bottom:6px;display:flex;justify-content:space-between}
.ex-bar{height:6px;background:var(--line);border-radius:3px;margin-bottom:14px;overflow:hidden}
.ex-bar i{display:block;height:100%;background:var(--c3)}
.ex-q{font-family:Georgia,serif;font-size:1.12rem;font-weight:700;margin:0 0 14px}
.opt{display:block;width:100%;text-align:left;margin:0 0 8px;padding:11px 12px;border:1.5px solid var(--line);background:transparent;color:var(--text);border-radius:9px;font-size:.95rem;cursor:pointer}
.opt:not(:disabled):hover{border-color:var(--text)}
.opt.ok{border-color:#2e7d5b;background:rgba(46,125,91,.18)}
.opt.bad{border-color:#b23a2a;background:rgba(178,58,42,.18)}
.opt:disabled{cursor:default;color:var(--text);opacity:1}
.ex-exp{margin:10px 0 0;font-size:.9rem;color:var(--muted)}
.big{border:0;background:var(--text);color:var(--bg);padding:11px 18px;border-radius:9px;font-size:.95rem;font-weight:600;cursor:pointer;margin:8px 8px 0 0}
.big.alt{background:transparent;color:var(--text);border:1.5px solid var(--line)}
.score{font-family:Georgia,serif;font-size:2.6rem;font-weight:700;margin:4px 0}
.miss{margin:8px 0 0;padding:10px 12px;border-left:4px solid #b23a2a;background:var(--bg);border-radius:6px;font-size:.88rem}
.miss b{display:block}
.hide{display:none}
</style>
</head>

["pre","~10.000 a.C.","Viscachani: periodo lítico","Cazadores con puntas de proyectil tipo «hoja de laurel» conviven con fauna del pleistoceno. El lago Tauca cubría gran parte del altiplano."],
["pre","~1.200 a.C.","Wankarani y Chiripa","Wankarani (Oruro): aldeas igualitarias, cobre y esculturas de cabezas de llama. Chiripa (Titicaca): templete semisubterráneo y estilo «Yaya-mama»."],
["pre","~1.000 a.C. – s. XIII","Tiahuanaco","Pasa de aldea a gran centro urbano (desde el s. II d.C.): Akapana, Kalasasaya, Puerta del Sol, camellones y bronce. Colapsa en el s. XIII y deja paso a los señoríos collas."],
["pre","Siglo XV","Los incas en el Collasuyo","Pachacuti inicia la conquista del Collao, Túpac Inca Yupanqui la consolida y Huayna Cápac hace de Cochabamba centro de mitimaes."],
["con","1492 – 1493","Colón: primer viaje","Parte de Palos con tres carabelas (Santa María, La Pinta y La Niña) y llega a Guanahaní el 12 de octubre de 1492. Se abre el choque de dos culturas."],
["con","1493 – 1496","Colón: segundo viaje","Expedición numerosa para colonizar: llega a las Antillas Menores y se funda La Isabela en La Española."],
["con","1498 – 1500","Colón: tercer viaje","Llega por primera vez a tierra firme, la costa de Venezuela, cerca de la desembocadura del Orinoco."],
["con","1502 – 1504","Colón: cuarto viaje","Recorre la costa de Centroamérica buscando un paso al Oriente. Es su último viaje; muere en 1506."],
["con","1519 – 1522","Primera vuelta al mundo","Magallanes parte en 1519 y muere en Filipinas en 1521. Juan Sebastián El Cano completa el viaje y regresa a España en 1522."],
["con","16 nov 1532","Captura de Atahuallpa en Cajamarca","Francisco Pizarro apresa al inca. Atahuallpa paga un rescate en oro y plata y es ejecutado en 1533 acusado de idolatría, fratricidio y traición."],
["civ","1535 – 1536","Almagro hacia Chile","Diego de Almagro, socio de Pizarro, recorre el Collasuyo y cruza Charcas rumbo a Chile; la expedición fracasa y regresa al Cuzco."],
["civ","1538","Batalla de Las Salinas","Hernando Pizarro vence a Almagro en la disputa por el Cuzco y lo manda ejecutar."],
["con","1538","Fundación de La Plata (Chuquisaca)","Tras la conquista de Charcas por Gonzalo Pizarro se funda la ciudad que será sede de la Audiencia."],
["civ","26 jun 1541","Muerte de Francisco Pizarro","Los partidarios de Almagro asesinan a Pizarro en Lima; Almagro «el Mozo» asume el mando por poco tiempo."],
["col","1544","Primer virrey del Perú","Blasco Núñez de Vela llega a Lima para aplicar las Nuevas Leyes, lo que provoca la rebelión de Gonzalo Pizarro."],
["col","Enero 1545","Descubrimiento de Potosí","Diego Huallpa halla plata en el Cerro Rico (Sumaj Orcko), que dará origen a una de las mayores ciudades mineras del mundo."],
["civ","1544 – 1546","Rebelión de Gonzalo Pizarro","Encomenderos molestos con las Nuevas Leyes eligen jefe a Gonzalo Pizarro. En 1546 derrota y mata al virrey Núñez de Vela en Iñaquito."],
["civ","1547","Batalla de Huarina","Gonzalo Pizarro vence a las fuerzas realistas cerca del lago Titicaca y domina un tiempo el Alto Perú."],
["civ","1548","La Gasca pacifica el Perú","El presidente Pedro de la Gasca, enviado por el rey, derrota a Gonzalo Pizarro en Xaquixaguana y lo ejecuta. Luego reparte encomiendas y ordena fundar La Paz."],
["col","1548","Fundación de La Paz","Alonso de Mendoza funda Nuestra Señora de La Paz por orden de La Gasca: el 20 de octubre en Laja y el 23 definitivamente en Chuquiabo."],
["col","26 feb 1561","Fundación de Santa Cruz de la Sierra","Ñuflo de Chaves funda la ciudad y en 1562 se hace el repartimiento de naturales."],
